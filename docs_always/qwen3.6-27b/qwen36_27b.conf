limit_req_zone $binary_remote_addr zone=qwen36_limit:10m rate=8r/s;

upstream qwen36_sglang {
    server 127.0.0.1:30000;
    keepalive 32;
}

server {
    listen 18080;
    server_name _;

    client_max_body_size 128m;
    proxy_connect_timeout 360s;
    proxy_send_timeout 9000s;
    proxy_read_timeout 9000s;
    send_timeout 9000s;

    access_log /var/log/nginx/qwen36_27b_access.log;
    error_log /var/log/nginx/qwen36_27b_error.log;

    location / {
        limit_req zone=qwen36_limit burst=16 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://qwen36_sglang;
    }
}
